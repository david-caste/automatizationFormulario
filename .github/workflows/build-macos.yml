name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check Tk support
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build app
        run: python -m PyInstaller --clean --noconfirm app-mac.spec

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Registro de Guias.app" "RegistroDeGuias-macos-${{ matrix.arch }}.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RegistroDeGuias-macos-${{ matrix.arch }}
          path: RegistroDeGuias-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
